name: Linter


on: [ push ]

jobs:
  runs-on: ubuntu-latest
  steps:
    - name: Checkout code
      uses: actions/checkout

    - name: Setup node js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Install dependencies
        run: npm ci
    - name: Run eslint
        run: npm run lint
